<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybersecurity Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #071952, #088395);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .header h1 {
            color: #071952;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
        }

        .question-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .question-number {
            color: #088395;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            color: #222;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option {
            display: block;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: #eefcff;
            border-color: #088395;
        }

        .option input {
            margin-right: 10px;
        }

        .category {
            display: inline-block;
            background: #e8f7fa;
            color: #088395;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #071952, #088395);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔐 Cybersecurity Awareness Quiz</h1>
        <p>Test your cybersecurity knowledge</p>
    </div>

    <form method="POST" action="{{ url_for('submit_quiz') }}">

        {% for q in questions %}

        <div class="question-card">

            <div class="question-number">
                Question {{ loop.index }}
            </div>

            <div class="category">
                {{ q.category }}
            </div>

            <div class="question">
                {{ q.question }}
            </div>

            <input type="hidden"
                   name="question_ids"
                   value="{{ q.id }}">

            <label class="option">
                <input type="radio"
                       name="answer_{{ q.id }}"
                       value="A"
                       required>
                {{ q.option_a }}
            </label>

            <label class="option">
                <input type="radio"
                       name="answer_{{ q.id }}"
                       value="B">
                {{ q.option_b }}
            </label>

            <label class="option">
                <input type="radio"
                       name="answer_{{ q.id }}"
                       value="C">
                {{ q.option_c }}
            </label>

            <label class="option">
                <input type="radio"
                       name="answer_{{ q.id }}"
                       value="D">
                {{ q.option_d }}
            </label>

        </div>

        {% endfor %}

        <button type="submit" class="submit-btn">
            Submit Quiz
        </button>

    </form>

</div>

</body>
</html>
